<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude SessionKey</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header><span class="badge">本地工具</span><h1>Claude SessionKey</h1>
      <p>获取此浏览器中已登录账号的会话密钥。</p></header>
    <main>
      <button id="read" class="primary">读取 SessionKey</button>
      <p id="status" role="status" aria-live="polite">请先在此 Chrome 用户中登录 Claude。</p>
      <section id="result" hidden>
        <label for="key">SessionKey</label>
        <input id="key" type="password" readonly autocomplete="off" spellcheck="false">
        <div class="actions">
          <button id="toggle" aria-pressed="false">显示</button>
          <button id="copy">复制密钥</button>
          <button id="clear">清除</button>
        </div>
      </section>
      <a href="https://claude.ai/" target="_blank" rel="noopener noreferrer">打开 Claude ↗</a>
    </main>
    <footer>密钥相当于登录凭证，请勿分享。本工具不上传或保存密钥；复制后密钥会进入系统剪贴板。</footer>
  </body>
</html>
